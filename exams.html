<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Rooms — MSU Room Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="assets/logo.png" alt="MSU" class="brand-logo">
            <span class="brand-name">MSU Room Finder</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
            <span class="material-symbols-rounded">menu</span>
        </button>
        <ul class="nav-links">
            <li id="nav-home" data-label="Home"><a href="index.html"><img src="assets/Home.png" alt="" class="nav-icon"><span class="nav-label">Home</span></a></li>
            <li id="nav-colleges" data-label="Colleges"><a href="colleges.html"><img src="assets/colleges.png" alt="" class="nav-icon"><span class="nav-label">Colleges</span></a></li>
            <li class="active" id="nav-exams" data-label="Exam Rooms"><a href="exams.html"><img src="assets/exams.png" alt="" class="nav-icon"><span class="nav-label">Exam Rooms</span></a></li>
            <li id="nav-saved" data-label="Saved Rooms"><a href="savedrooms.html"><img src="assets/savedRoom.png" alt="" class="nav-icon"><span class="nav-label">Saved Rooms</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <button class="login-btn" id="loginBtn">
                <span class="material-symbols-rounded login-icon">account_circle</span>
                <span class="login-btn-label">Login / Signup</span>
            </button>
        </div>
    </nav>

    <main class="main-content" id="mainContent">
        <header class="top-banner">
            <div class="banner-text">
                <span class="badge"><span class="material-symbols-rounded badge-icon">edit_document</span> EXAMS</span>
                <h1>Exam Rooms</h1>
                <p>Find your exam venue quickly before time runs out.</p>
            </div>
            <div class="banner-right">
                <div class="search-box">
                    <span class="material-symbols-rounded search-icon">search</span>
                    <input type="text" id="searchInput" placeholder="Search exam room...">
                </div>
            </div>
        </header>

        <!-- Exam type chips -->
        <div class="chip-row">
            <button class="chip active" data-filter="all">All Exams</button>
            <button class="chip" data-filter="Math">Math</button>
            <button class="chip" data-filter="Science">Science</button>
            <button class="chip" data-filter="Engineering">Engineering</button>
            <button class="chip" data-filter="Board">Board Exam</button>
        </div>

        <p class="section-label">Exam Venues</p>
        <section class="grid-container" id="gridContainer"></section>
    </main>

    <script>
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('mainContent').classList.toggle('expanded');
        });

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                filterRooms(chip.dataset.filter);
            });
        });

        const examRooms = [
            { id: 1, code: 'MATH-EX1', direction: 'Main Hall, Room 201', info: 'Math Departmental Exam', image: null },
            { id: 2, code: 'SCI-EX2', direction: 'Science Bldg, Room 105', info: 'Science Departmental Exam', image: null },
            { id: 3, code: 'ENG-EX1', direction: 'Engineering Bldg, Room 301', info: 'Engineering Board Exam', image: null },
            { id: 4, code: 'BOARD-01', direction: 'Gymnasium, Ground Floor', info: 'Board Exam Venue', image: null },
        ];

        let allRooms = [...examRooms];

        function displayRooms(rooms) {
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';
            if (!rooms.length) { grid.innerHTML = '<p class="empty-state">No exam rooms found.</p>'; return; }
            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.innerHTML = `
                    <div class="card-img-placeholder exam-placeholder">
                        <img src="assets/exams.png" alt="" class="card-placeholder-icon">
                    </div>
                    <div class="card-info">
                        <h3>${room.code}</h3>
                        <p><strong>Type:</strong> ${room.info}</p>
                        <p class="card-dir">${room.direction}</p>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function filterRooms(filter) {
            if (filter === 'all') { displayRooms(allRooms); return; }
            displayRooms(allRooms.filter(r => r.info.toLowerCase().includes(filter.toLowerCase())));
        }

        document.getElementById('searchInput').addEventListener('input', e => {
            const t = e.target.value.toLowerCase();
            displayRooms(allRooms.filter(r => r.code.toLowerCase().includes(t) || r.info.toLowerCase().includes(t) || r.direction.toLowerCase().includes(t)));
        });

        displayRooms(allRooms);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-sync.js"></script>
</body>
</html>
