<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colleges — MSU Room Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="assets/logo.png" alt="MSU" class="brand-logo">
            <span class="brand-name">MSU Room Finder</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
            <span class="material-symbols-rounded">menu</span>
        </button>
        <ul class="nav-links">
            <li id="nav-home" data-label="Home"><a href="index.html"><img src="assets/Home.png" alt="" class="nav-icon"><span class="nav-label">Home</span></a></li>
            <li class="active" id="nav-colleges" data-label="Colleges"><a href="colleges.html"><img src="assets/colleges.png" alt="" class="nav-icon"><span class="nav-label">Colleges</span></a></li>
            <li id="nav-exams" data-label="Exam Rooms"><a href="exams.html"><img src="assets/exams.png" alt="" class="nav-icon"><span class="nav-label">Exam Rooms</span></a></li>
            <li id="nav-saved" data-label="Saved Rooms"><a href="savedrooms.html"><img src="assets/savedRoom.png" alt="" class="nav-icon"><span class="nav-label">Saved Rooms</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <button class="login-btn" id="loginBtn">
                <span class="material-symbols-rounded login-icon">account_circle</span>
                <span class="login-btn-label">Login / Signup</span>
            </button>
        </div>
    </nav>

    <main class="main-content" id="mainContent">
        <header class="top-banner">
            <div class="banner-text">
                <span class="badge"><span class="material-symbols-rounded badge-icon">school</span> COLLEGES</span>
                <h1>Colleges</h1>
                <p>Browse rooms by college or department.</p>
            </div>
            <div class="banner-right">
                <div class="search-box">
                    <span class="material-symbols-rounded search-icon">search</span>
                    <input type="text" id="searchInput" placeholder="Search a college or room...">
                </div>
            </div>
        </header>

        <div class="chip-row">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="cics">CICS</button>
            <button class="chip" data-filter="coe">COE</button>
            <button class="chip" data-filter="cbaa">CBAA</button>
            <button class="chip" data-filter="cnsm">CNSM</button>
        </div>

        <p class="section-label">College Rooms</p>
        <section class="grid-container" id="gridContainer"></section>
    </main>

    <script src="colleges.js"></script>
    <script src="auth-sync.js"></script>
</body>
</html>
