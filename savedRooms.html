<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Rooms — MSU Room Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="assets/logo.png" alt="MSU" class="brand-logo">
            <span class="brand-name">MSU Room Finder</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
            <span class="material-symbols-rounded">menu</span>
        </button>
        <ul class="nav-links">
            <li id="nav-home" data-label="Home"><a href="index.html"><img src="assets/Home.png" alt="" class="nav-icon"><span class="nav-label">Home</span></a></li>
            <li id="nav-colleges" data-label="Colleges"><a href="colleges.html"><img src="assets/colleges.png" alt="" class="nav-icon"><span class="nav-label">Colleges</span></a></li>
            <li id="nav-exams" data-label="Exam Rooms"><a href="exams.html"><img src="assets/exams.png" alt="" class="nav-icon"><span class="nav-label">Exam Rooms</span></a></li>
            <li class="active" id="nav-saved" data-label="Saved Rooms"><a href="savedrooms.html"><img src="assets/savedRoom.png" alt="" class="nav-icon"><span class="nav-label">Saved Rooms</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <button class="login-btn" id="loginBtn">
                <span class="material-symbols-rounded login-icon">account_circle</span>
                <span class="login-btn-label">Login / Signup</span>
            </button>
        </div>
    </nav>

    <main class="main-content" id="mainContent">
        <header class="top-banner">
            <div class="banner-text">
                <span class="badge"><span class="material-symbols-rounded badge-icon">bookmark</span> SAVED</span>
                <h1>Saved Rooms</h1>
                <p>Your bookmarked rooms and venues, all in one place.</p>
            </div>
        </header>

        <div class="saved-empty" id="savedEmpty">
            <img src="assets/notsavedroom.png" alt="" class="saved-empty-icon">
            <h3>No saved rooms yet</h3>
            <p>Go to Home and save rooms you visit often.</p>
            <a href="index.html" class="btn-primary" style="display:inline-block; margin-top:16px; text-decoration:none; padding:12px 24px; border-radius:10px;">Browse Rooms</a>
        </div>

        <section class="grid-container" id="gridContainer" style="display:none;"></section>
    </main>

    <script>
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('mainContent').classList.toggle('expanded');
        });
        // Saved rooms feature placeholder — wire to Supabase auth later
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-sync.js"></script>
</body>
</html>
